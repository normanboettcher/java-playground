name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest   # Docker is preinstalled, so Testcontainers works out of the box
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run all scenarios on PostgreSQL and MariaDB
        run: mvn -B -ntp verify
